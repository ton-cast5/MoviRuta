<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MoviRuta</title>
    <meta name="theme-color" content="#004532">
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/tailwind-config.js"></script>
    <link rel="stylesheet" href="assets/css/moviruta.css">
</head>
<body class="bg-surface font-sans text-on-surface" data-base="." data-pagina="paradas">
<a class="saltar-contenido" href="#contenido">Saltar al contenido</a>
<div id="mr-encabezado" class="fixed inset-x-0 top-0 z-[1500] h-20 bg-primary"></div>

<main id="contenido" class="pt-20">
    <section id="mr-cabecera" data-titulo="Cargando parada…" data-migas='[["Paradas","paradas.html"],["Parada"]]'></section>

    <section id="cuerpoParada" class="relative z-10 mx-auto -mt-16 max-w-[1440px] px-margin pb-16 md:px-margin-tablet lg:px-margin-desktop">
        <div class="grid items-start gap-gutter-desktop lg:grid-cols-12">
            <div class="flex flex-col gap-5 lg:col-span-5">
                <div class="mr-anim-subir rounded-xl bg-surface-container-lowest p-5 shadow-2xl ring-1 ring-black/5" style="--retraso:180ms">
                    <h2 class="flex items-center gap-2 text-label-sm font-label-sm uppercase tracking-widest text-on-surface-variant">
                        <span class="material-symbols-outlined text-[18px] text-secondary">schedule</span> Próximas llegadas
                    </h2>
                    <div id="llegadas" class="mt-3 flex flex-col gap-3" aria-live="polite"></div>
                    <p class="mt-3 text-xs text-outline">Los tiempos son estimaciones basadas en la ubicación de cada unidad y la velocidad promedio de la ruta.</p>
                </div>

                <div class="mr-revelar">
                    <h2 class="mb-3 flex items-center gap-2 text-label-sm font-label-sm uppercase tracking-widest text-on-surface-variant">
                        <span class="material-symbols-outlined text-[18px] text-secondary">route</span> Rutas que pasan por aquí
                    </h2>
                    <div id="rutasParada" class="flex flex-col gap-3"></div>
                </div>
                <a class="mr-btn mr-btn-contorno self-start" href="paradas.html"><span class="material-symbols-outlined">arrow_back</span> Seleccionar otra parada</a>
            </div>
            <div class="lg:sticky lg:top-24 lg:col-span-7">
                <div class="mr-mapa-tarjeta mr-anim-escala relative h-[440px] overflow-hidden rounded-xl bg-surface-container shadow-xl ring-1 ring-black/5 lg:h-[640px]" style="--retraso:240ms">
                    <div id="mapa" class="mr-mapa" role="region" aria-label="Mapa de la parada"></div>
                </div>
                <div class="mt-3 mr-actualizacion" id="indicador"></div>
            </div>
        </div>
    </section>
</main>

<div id="mr-pie"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="assets/js/datos.js"></script>
<script src="assets/js/servicios.js"></script>
<script src="assets/js/moviruta.js"></script>
<script src="assets/js/interfaz.js"></script>
<script src="assets/js/parada.js"></script>
</body>
</html>
