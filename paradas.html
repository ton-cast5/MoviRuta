<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MoviRuta</title>
    <meta name="description" content="Consulta qué rutas pasan por cada parada y cuánto falta para la próxima unidad.">
    <meta name="theme-color" content="#004532">
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/tailwind-config.js"></script>
    <link rel="stylesheet" href="assets/css/moviruta.css">
</head>
<body class="bg-surface font-sans text-on-surface" data-base="." data-pagina="paradas">
<a class="saltar-contenido" href="#contenido">Saltar al contenido</a>
<div id="mr-encabezado" class="fixed inset-x-0 top-0 z-[1500] h-20 bg-primary"></div>

<main id="contenido" class="pt-20">
    <section id="mr-cabecera" data-titulo="Paradas" data-icono="location_on"
             data-subtitulo="Consulta qué rutas pasan por cada parada y cuánto falta aproximadamente para la próxima unidad."
             data-migas='[["Paradas"]]'></section>

    <section class="relative z-10 mx-auto -mt-16 max-w-[1440px] px-margin pb-16 md:px-margin-tablet lg:px-margin-desktop">
        <div class="grid items-start gap-gutter-desktop lg:grid-cols-12">
            <div class="flex flex-col gap-4 lg:col-span-5">
                <form id="formParadas" class="mr-anim-subir rounded-xl bg-surface-container-lowest p-4 shadow-2xl ring-1 ring-black/5" style="--retraso:180ms" role="search">
                    <div class="relative">
                        <label class="sr-only" for="q">Buscar parada</label>
                        <span class="material-symbols-outlined pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-[20px] text-outline">search</span>
                        <input class="mr-campo !pl-10" type="search" id="q" maxlength="80" placeholder="Nombre, referencia o código (#108)" autocomplete="off">
                    </div>
                    <button class="mr-btn mr-btn-primario mt-3 w-full !py-3" type="button" id="btnCercanas">
                        <span class="material-symbols-outlined">near_me</span> <span>Paradas cerca de mí</span>
                    </button>
                    <div id="mensajeCercanas" class="mt-2 text-sm empty:hidden" role="status" aria-live="polite"></div>
                </form>

                <div id="cercanas" class="hidden">
                    <div class="mb-3 flex items-center justify-between">
                        <h2 class="flex items-center gap-2 text-label-sm font-label-sm uppercase tracking-widest text-on-surface-variant">
                            <span class="material-symbols-outlined text-[18px] text-secondary">my_location</span> Cerca de ti
                        </h2>
                        <button class="mr-btn mr-btn-contorno mr-btn-sm" type="button" id="btnQuitarCercanas">Ver todas</button>
                    </div>
                    <div class="flex flex-col gap-3" id="listaCercanas"></div>
                </div>

                <div id="todas">
                    <p id="resumen" class="mb-3 text-sm text-on-surface-variant" role="status" aria-live="polite"></p>
                    <div class="flex flex-col gap-3" id="listaParadas"></div>
                </div>
            </div>
            <div class="lg:sticky lg:top-24 lg:col-span-7">
                <div class="mr-mapa-tarjeta mr-anim-escala relative h-[440px] overflow-hidden rounded-xl bg-surface-container shadow-xl ring-1 ring-black/5 lg:h-[680px]" style="--retraso:240ms">
                    <div id="mapa" class="mr-mapa" role="region" aria-label="Mapa de paradas"></div>
                </div>
            </div>
        </div>
    </section>
</main>

<div id="mr-pie"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="assets/js/datos.js"></script>
<script src="assets/js/servicios.js"></script>
<script src="assets/js/moviruta.js"></script>
<script src="assets/js/interfaz.js"></script>
<script src="assets/js/paradas.js"></script>
</body>
</html>
