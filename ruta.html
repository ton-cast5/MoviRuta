<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ruta · MoviRuta</title>
    <meta name="theme-color" content="#004532">
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/tailwind-config.js"></script>
    <link rel="stylesheet" href="assets/css/moviruta.css">
</head>
<body class="bg-surface font-sans text-on-surface" data-base="." data-pagina="rutas">
<a class="saltar-contenido" href="#contenido">Saltar al contenido</a>
<div id="mr-encabezado" class="fixed inset-x-0 top-0 z-[1500] h-20 bg-primary"></div>

<main id="contenido" class="pt-20">
    <section id="mr-cabecera" data-titulo="Cargando ruta…" data-migas='[["Rutas","rutas.html"],["Ruta"]]'></section>

    <section class="relative z-10 mx-auto -mt-16 max-w-[1440px] px-margin pb-16 md:px-margin-tablet lg:px-margin-desktop">
        <div id="datosRuta" class="mr-anim-subir rounded-xl bg-surface-container-lowest p-5 shadow-2xl ring-1 ring-black/5" style="--retraso:180ms">
            <div class="grid grid-cols-2 gap-4 md:grid-cols-3 lg:grid-cols-6"><div class="mr-esqueleto h-10"></div><div class="mr-esqueleto h-10"></div><div class="mr-esqueleto h-10"></div></div>
        </div>

        <div class="mt-6 grid items-start gap-gutter-desktop lg:grid-cols-12">
            <div class="flex flex-col gap-5 lg:col-span-5">
                <div class="mr-tarjeta mr-revelar p-5" aria-live="polite">
                    <h2 class="flex items-center gap-2 text-label-sm font-label-sm uppercase tracking-widest text-on-surface-variant">
                        <span class="material-symbols-outlined text-[18px] text-secondary">schedule</span> Tiempo aproximado de llegada
                    </h2>
                    <div id="panelEta" class="mt-3">
                        <p class="flex items-center gap-2 rounded-lg border border-dashed border-outline-variant px-3 py-3 text-sm text-on-surface-variant">
                            <span class="material-symbols-outlined text-[20px] text-secondary">touch_app</span>
                            Selecciona una parada del recorrido o del mapa para ver cuánto falta aproximadamente para que llegue una unidad.
                        </p>
                    </div>
                </div>

                <div class="mr-revelar" style="--retraso:80ms">
                    <div class="mr-pestanas" role="tablist">
                        <button type="button" class="mr-pestana activa" role="tab" aria-selected="true" data-pestana="recorrido"><span class="material-symbols-outlined text-[18px]">timeline</span> Recorrido completo</button>
                        <button type="button" class="mr-pestana" role="tab" aria-selected="false" data-pestana="vehiculos"><span class="material-symbols-outlined text-[18px]">directions_bus</span> Vehículos <span class="rounded-full bg-secondary-container/60 px-1.5 text-[11px] font-bold text-on-secondary-container" id="contadorVehiculos">…</span></button>
                    </div>
                    <div class="mr-tarjeta mr-panel-pestana mt-3 p-5" data-panel="recorrido">
                        <p id="textoSentido" class="mb-3 flex items-center gap-1.5 text-sm text-on-surface-variant"></p>
                        <ol class="mr-recorrido" id="listaParadas"></ol>
                        <p class="mt-3 text-xs text-outline">Los tiempos desde el inicio son aproximados y pueden variar por el tráfico.</p>
                    </div>
                    <div class="mr-tarjeta mr-panel-pestana mt-3 hidden p-2" data-panel="vehiculos" id="listaVehiculos"></div>
                </div>
                <a class="mr-btn mr-btn-contorno self-start" href="rutas.html"><span class="material-symbols-outlined">arrow_back</span> Ver todas las rutas</a>
            </div>

            <div class="lg:sticky lg:top-24 lg:col-span-7">
                <div class="mr-mapa-tarjeta mr-anim-escala relative h-[440px] overflow-hidden rounded-xl bg-surface-container shadow-xl ring-1 ring-black/5 lg:h-[640px]" style="--retraso:240ms">
                    <div id="mapa" class="mr-mapa" role="region" aria-label="Mapa de la ruta"></div>
                </div>
                <div class="mt-3 mr-actualizacion" id="indicador"></div>
            </div>
        </div>
    </section>
</main>

<div id="mr-pie"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="assets/js/datos.js"></script>
<script src="assets/js/servicios.js"></script>
<script src="assets/js/moviruta.js"></script>
<script src="assets/js/interfaz.js"></script>
<script src="assets/js/ruta.js"></script>
</body>
</html>
